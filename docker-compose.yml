version: '3.9'

# Frontend-only repo (https://github.com/vishalbhor-45/TAMS)
# Backend lives in https://github.com/planeteyeai/TAMS-Backend
# Set BACKEND_CONTEXT to a local clone of TAMS-Backend (default: ../TAMS-Backend).

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: tams-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tams_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tams_password}
      POSTGRES_DB: ${POSTGRES_DB:-tams_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tams_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tams-network

  redis:
    image: redis:7-alpine
    container_name: tams-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-tams_redis_password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tams-network

  backend:
    build:
      context: ${BACKEND_CONTEXT:-../TAMS-Backend}
      dockerfile: Dockerfile
    container_name: tams-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tams_user}:${POSTGRES_PASSWORD:-tams_password}@postgres:5432/${POSTGRES_DB:-tams_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-tams_redis_password}@redis:6379/0
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: "8000"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,*}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tams-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        BACKEND_URL: http://backend:8000
    container_name: tams-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tams-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  tams-network:
    driver: bridge
