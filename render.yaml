# Render Blueprint — TAMS Frontend only
# Backend is a separate repo: https://github.com/planeteyeai/TAMS-Backend
#
# Required env on this frontend service:
#   BACKEND_URL = https://<your-backend-service>.onrender.com
#   NEXT_PUBLIC_HOSTED_API_BASE_URL = https://<your-backend-service>.onrender.com/api/v1

services:
  - type: web
    name: tams-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "18.20.4"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api/v1
      - key: BACKEND_URL
        sync: false
      - key: NEXT_PUBLIC_HOSTED_API_BASE_URL
        sync: false
