# Render Blueprint — TAMS Frontend (Next.js Web Service)
# Repo: https://github.com/vishalbhor-45/TAMS
# Backend (Railway): https://tams-backend.up.railway.app
#
# IMPORTANT: This must be a Web Service (Node), NOT a Static Site.
# Next.js here uses SSR + /api routes, so a Static Site returns 404 on every path.
#
# Dashboard settings if not using this blueprint:
#   Type: Web Service
#   Root Directory: frontend
#   Build Command: npm install && npm run build
#   Start Command: npm start
#   Publish Directory: (leave EMPTY / not used)
#
# CORS on Railway must allow: https://tams-txmr.onrender.com
# (*.onrender.com already matches the backend CORS regex.)

services:
  - type: web
    name: tams-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    # Free-tier tip: if deploy succeeds but site 502s, open Logs → look for
    # "Ready in" / crash / "Error: listen".
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api/v1
      - key: NEXT_PUBLIC_APP_NAME
        value: TAMS Platform
      - key: NEXT_PUBLIC_IMAGERY_TILE_URL
        value: https://mt1.google.com/vt/lyrs=s
      - key: BACKEND_URL
        value: https://tams-backend.up.railway.app
      - key: NEXT_PUBLIC_HOSTED_API_BASE_URL
        value: https://tams-backend.up.railway.app/api/v1
      - key: NEXT_PUBLIC_APP_URL
        value: https://tams-txmr.onrender.com
