# Render Blueprint — TAMS Frontend (Next.js Web Service)
# Repo: https://github.com/vishalbhor-45/TAMS
# Backend (Railway): https://github.com/planeteyeai/TAMS-Backend
#
# IMPORTANT: This must be a Web Service (Node), NOT a Static Site.
# Static Site looks for "Publish directory dist" and will fail with:
#   ==> Publish directory dist does not exist!
# Next.js uses `.next` + `npm start` (no dist folder).
#
# Dashboard settings if not using this blueprint:
#   Type: Web Service
#   Root Directory: frontend
#   Build Command: npm install && npm run build
#   Start Command: npm start
#   Publish Directory: (leave EMPTY / not used)
#
# Env vars:
#   BACKEND_URL = https://<your-service>.up.railway.app
#   NEXT_PUBLIC_HOSTED_API_BASE_URL = https://<your-service>.up.railway.app/api/v1
# CORS on Railway must include: https://tams-1-tgkn.onrender.com

services:
  - type: web
    name: tams-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    # Avoid / health checks on free-tier cold starts (they often cause 502 loops)
    envVars:
      - key: NODE_VERSION
        value: "18.20.4"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api/v1
      - key: NEXT_PUBLIC_APP_NAME
        value: TAMS Platform
      - key: NEXT_PUBLIC_IMAGERY_TILE_URL
        value: https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer
      - key: BACKEND_URL
        sync: false
      - key: NEXT_PUBLIC_HOSTED_API_BASE_URL
        sync: false
